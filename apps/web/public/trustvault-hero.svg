<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#1E1B4B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect width="800" height="600" fill="url(#bgGlow)" />

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#94A3B8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="600" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="240" y1="0" x2="240" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="560" y1="0" x2="560" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
    <line x1="720" y1="0" x2="720" y2="600" />
    <line x1="0" y1="80" x2="800" y2="800" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="480" x2="800" y2="480" />
    <line x1="0" y1="560" x2="800" y2="560" />
  </g>

  <!-- Concentric Orbit Rings -->
  <circle cx="400" cy="300" r="240" stroke="#38BDF8" stroke-width="1" stroke-dasharray="6 8" opacity="0.15" />
  <circle cx="400" cy="300" r="180" stroke="#818CF8" stroke-width="1" stroke-dasharray="4 6" opacity="0.25" />
  <circle cx="400" cy="300" r="120" stroke="#38BDF8" stroke-width="1.5" opacity="0.3" />

  <!-- Background Data Flow Lines -->
  <path d="M 120 450 Q 250 320 400 300 T 680 180" stroke="url(#accentLine)" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 140 180 Q 280 260 400 300 T 660 420" stroke="url(#accentLine)" stroke-width="2" fill="none" opacity="0.4" />

  <!-- ========================================== -->
  <!-- FLOATING CARD 1: Top Left (financial_audit) -->
  <!-- ========================================== -->
  <g transform="translate(100, 110)" filter="url(#cardShadow)">
    <rect width="250" height="96" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
    <!-- File Icon -->
    <rect x="18" y="20" width="38" height="48" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
    <path d="M 44 20 L 56 32 L 44 32 Z" fill="#3B82F6" opacity="0.7" />
    <line x1="26" y1="36" x2="48" y2="36" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="26" y1="44" x2="44" y2="44" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="26" y1="52" x2="38" y2="52" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

    <!-- Text Info -->
    <text x="68" y="38" fill="#F8FAFC" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="600">financial_q4_audit.pdf</text>
    <text x="68" y="55" fill="#94A3B8" font-size="11" font-family="system-ui, -apple-system, sans-serif">14.2 MB • Updated 2h ago</text>

    <!-- Tag Badge -->
    <rect x="68" y="66" width="94" height="18" rx="9" fill="#1E3A8A" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1" />
    <circle cx="78" cy="75" r="3" fill="#38BDF8" />
    <text x="86" y="79" fill="#93C5FD" font-size="9.5" font-family="system-ui, -apple-system, sans-serif" font-weight="600">AES-256 VAULT</text>
  </g>

  <!-- ========================================== -->
  <!-- FLOATING CARD 2: Bottom Right (permissions) -->
  <!-- ========================================== -->
  <g transform="translate(460, 390)" filter="url(#cardShadow)">
    <rect width="240" height="92" rx="14" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" />
    <!-- Shield / User Icon -->
    <rect x="18" y="20" width="38" height="46" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <!-- Checkmark Icon in Box -->
    <path d="M 28 42 L 34 48 L 46 34" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <text x="68" y="38" fill="#F8FAFC" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="600">Role-Based Grants</text>
    <text x="68" y="55" fill="#94A3B8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Owner • Editor • Viewer</text>

    <rect x="68" y="64" width="84" height="18" rx="9" fill="#064E3B" fill-opacity="0.5" stroke="#10B981" stroke-width="1" />
    <circle cx="78" cy="73" r="3" fill="#34D399" />
    <text x="86" y="77" fill="#6EE7B7" font-size="9.5" font-family="system-ui, -apple-system, sans-serif" font-weight="600">AUTHORIZED</text>
  </g>

  <!-- ========================================== -->
  <!-- FLOATING CARD 3: Bottom Left (audit log) -->
  <!-- ========================================== -->
  <g transform="translate(90, 410)" filter="url(#cardShadow)">
    <rect width="210" height="74" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
    <circle cx="36" cy="37" r="14" fill="#312E81" stroke="#818CF8" stroke-width="1.5" />
    <path d="M 32 37 L 36 41 L 42 33" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="58" y="32" fill="#F8FAFC" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="600">Immutable Audit</text>
    <text x="58" y="48" fill="#94A3B8" font-size="10.5" font-family="system-ui, -apple-system, sans-serif">action: DOCUMENT_READ</text>
    <text x="58" y="62" fill="#38BDF8" font-size="9" font-family="monospace">SHA-256: 8f9b...e21c</text>
  </g>

  <!-- ========================================== -->
  <!-- CENTRAL VAULT SHIELD (Main Hero Focal Point) -->
  <!-- ========================================== -->
  <g transform="translate(340, 210)" filter="url(#glow)">
    <!-- Outer Glow Shield -->
    <path d="M 60 10 L 115 35 V 95 C 115 135 60 165 60 165 C 60 165 5 135 5 95 V 35 Z" fill="#2563EB" opacity="0.3" filter="url(#glow)" />
    <!-- Main Gradient Shield -->
    <path d="M 60 15 L 110 38 V 92 C 110 130 60 158 60 158 C 60 158 10 130 10 92 V 38 Z" fill="url(#shieldGrad)" stroke="#60A5FA" stroke-width="2.5" />
    <!-- Inner Dark Core Shield -->
    <path d="M 60 28 L 98 46 V 88 C 98 120 60 142 60 142 C 60 142 22 120 22 88 V 46 Z" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Modern Keyhole / Vault Lock -->
    <circle cx="60" cy="72" r="14" fill="#38BDF8" />
    <circle cx="60" cy="72" r="6" fill="#0B132B" />
    <path d="M 56 76 L 64 76 L 67 98 L 53 98 Z" fill="#38BDF8" />

    <!-- Pulse Ring around Lock -->
    <circle cx="60" cy="78" r="32" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6" />
  </g>

  <!-- Connecting Digital Beams -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.5">
    <line x1="340" y1="260" x2="280" y2="200" stroke-dasharray="3 3" />
    <circle cx="280" cy="200" r="3" fill="#38BDF8" />
    
    <line x1="460" y1="280" x2="520" y2="380" stroke-dasharray="3 3" />
    <circle cx="520" cy="380" r="3" fill="#38BDF8" />
    
    <line x1="360" y1="360" x2="260" y2="420" stroke-dasharray="3 3" />
    <circle cx="260" cy="420" r="3" fill="#38BDF8" />
  </g>

  <!-- Floating Security Particles -->
  <circle cx="490" cy="160" r="3" fill="#60A5FA" opacity="0.8" />
  <circle cx="530" cy="190" r="2" fill="#818CF8" opacity="0.6" />
  <circle cx="280" cy="330" r="2.5" fill="#34D399" opacity="0.7" />
  <circle cx="520" cy="240" r="4" fill="#38BDF8" opacity="0.5" />
  <circle cx="310" cy="180" r="2" fill="#93C5FD" opacity="0.9" />
  <circle cx="480" cy="320" r="3" fill="#A78BFA" opacity="0.7" />
</svg>
